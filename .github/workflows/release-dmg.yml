name: Release DMG

# Push a tag like v1.0.1 to build the DMG on a macOS runner and attach it
# (plus its SHA-256) to a GitHub Release with the same tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set app version from tag
        run: |
          version="${{ steps.release.outputs.tag }}"
          version="${version#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" Info.plist

      - name: Build DMG
        run: ./build-dmg.zsh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          dmg=$(ls dist/*.dmg | head -1)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" "$dmg.sha256" --clobber
          else
            gh release create "$tag" "$dmg" "$dmg.sha256" \
              --title "Model Compare Studio ${tag#v}" \
              --generate-notes
            # Auto-generated notes omit the Gatekeeper workaround every
            # ad-hoc-signed download needs, so append it after creation.
            notes=$(mktemp)
            gh release view "$tag" --json body --jq .body > "$notes"
            cat .github/release-install-notes.md >> "$notes"
            gh release edit "$tag" --notes-file "$notes"
          fi
