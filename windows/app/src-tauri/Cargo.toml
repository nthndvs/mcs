[workspace]

[package]
name = "model-compare-studio"
version = "1.4.3"
description = "Model Compare Studio — prompt multiple LLM providers at once"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
